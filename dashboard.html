<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SELLORA Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:10px;
}
</style>
</head>

<body class="bg-[#0f172a] text-white">

<div class="flex min-h-screen">

<!-- SIDEBAR -->
<aside class="w-64 bg-black p-6">

<h1 class="text-xl font-bold mb-8">SELLORA</h1>

<nav class="space-y-4 text-gray-300">

<button onclick="showSection('deal')" class="block w-full text-left">AI Deal Engine</button>
<button onclick="showSection('overview')" class="block w-full text-left">Overview</button>
<button onclick="showSection('trending')" class="block w-full text-left">Trending Products</button>
<button onclick="showSection('scanner')" class="block w-full text-left">Product Opportunity Scanner</button>
<button onclick="showSection('imports')" class="block w-full text-left">Global Import Tracker</button>
<button onclick="showSection('alerts')" class="block w-full text-left">AI Opportunity Alerts</button>
<button onclick="showSection('radar')" class="block w-full text-left">Global Export Radar</button>
<button onclick="showSection('predictor')" class="block w-full text-left">AI Market Predictor</button>
<button onclick="showSection('suppliers')" class="block w-full text-left">Supplier Intelligence</button>
<button onclick="showSection('heatmap')" class="block w-full text-left">Global Demand Map</button>
<button onclick="showSection('ai')" class="block w-full text-left">AI Export Advisor</button>
<button onclick="showSection('saved')" class="block w-full text-left">Saved Deals</button>

<button onclick="logout()" class="block w-full text-left text-red-400 mt-10">Logout</button>

</nav>

</aside>

<!-- MAIN -->
<div class="flex-1 p-10">

<!-- DEMO BANNER -->
<div id="upgradeBanner" class="hidden bg-yellow-400 text-black p-3 mb-6 rounded flex justify-between">
<span>🚀 Demo Mode — Upgrade to unlock full features</span>
<button onclick="goToPricing()" class="bg-black text-white px-3 py-1 rounded">Upgrade Now</button>
</div>

<!-- DEAL -->
<div id="deal">
<h2 class="text-3xl mb-6">AI Deal Engine</h2>
<div id="dealList"></div>
</div>

<!-- OVERVIEW -->
<div id="overview" style="display:none">
<h2 class="text-3xl mb-6">Overview</h2>
<div id="overviewContent"></div>
</div>

<!-- TRENDING -->
<div id="trending" style="display:none">
<h2 class="text-3xl mb-6">Trending Products</h2>
<div id="topOpportunity"></div>
<div id="productsList"></div>
</div>

<!-- OTHER SECTIONS -->
<div id="scanner" style="display:none"><div id="scannerList"></div></div>
<div id="imports" style="display:none"><div id="importsList"></div></div>
<div id="alerts" style="display:none"><div id="alertsList"></div></div>
<div id="radar" style="display:none"><div id="radarList"></div></div>
<div id="predictor" style="display:none"><div id="predictorList"></div></div>
<div id="suppliers" style="display:none"><div id="supplierList"></div></div>
<div id="heatmap" style="display:none"><div id="regions_div"></div></div>
<div id="ai" style="display:none"><div id="aiResults"></div></div>
<div id="saved" style="display:none"><div id="savedDealsList"></div></div>

</div>
</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDJGPJmz2459zqdIRTQfrWNy83w2qYnK68",
authDomain: "sellora-ai.firebaseapp.com",
projectId: "sellora-ai"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* DEMO */
if(localStorage.getItem("demo_mode")){
document.getElementById("upgradeBanner").classList.remove("hidden");
}

/* SWITCH */
window.showSection = function(section){

const sections = ["deal","overview","trending","scanner","imports","alerts","radar","predictor","suppliers","heatmap","ai","saved"];

sections.forEach(id=>{
document.getElementById(id).style.display="none";
});

document.getElementById(section).style.display="block";

/* LOADERS */
if(section==="deal") loadDeals();
if(section==="overview") loadOverview();
if(section==="trending") loadProducts();
if(section==="scanner") loadScanner();
if(section==="imports") loadImports();
if(section==="alerts") loadAlerts();
if(section==="radar") loadRadar();
if(section==="predictor") loadPredictor();
if(section==="suppliers") loadSuppliers();
};

/* DEALS */
async function loadDeals(){
const container = document.getElementById("dealList");
container.innerHTML="Loading...";

const snap = await getDocs(collection(db,"products"));

container.innerHTML="";

snap.forEach(doc=>{
const d = doc.data();
container.innerHTML += `<div class="card">${d.product} - ${d.best_market}</div>`;
});
}

/* TRENDING */
async function loadProducts(){
const container = document.getElementById("productsList");
const topBox = document.getElementById("topOpportunity");

const snap = await getDocs(collection(db,"products"));

let top=null;
container.innerHTML="";

snap.forEach(doc=>{
const d = doc.data();

if(!top || d.trend_score > top.trend_score){
top = d;
}

container.innerHTML += `<div class="card">${d.product} (${d.demand_score})</div>`;
});

if(top){
topBox.innerHTML = `<div class="card">🔥 Best: ${top.product}</div>`;
}
}

/* OVERVIEW */
async function loadOverview(){
const snap = await getDocs(collection(db,"products"));
document.getElementById("overviewContent").innerHTML =
`<div class="card">Total Products: ${snap.size}</div>`;
}

/* DUMMY LOADERS */
function loadScanner(){
document.getElementById("scannerList").innerHTML="<div class='card'>Scanning market...</div>";
}
function loadImports(){
document.getElementById("importsList").innerHTML="<div class='card'>Global imports rising</div>";
}
function loadAlerts(){
document.getElementById("alertsList").innerHTML="<div class='card'>High demand alert</div>";
}
function loadRadar(){
document.getElementById("radarList").innerHTML="<div class='card'>Export radar active</div>";
}
function loadPredictor(){
document.getElementById("predictorList").innerHTML="<div class='card'>AI predicting trends</div>";
}
function loadSuppliers(){
document.getElementById("supplierList").innerHTML="<div class='card'>Supplier data available</div>";
}

/* LOGOUT */
window.logout=function(){
localStorage.clear();
window.location.href="login.html";
};

/* PRICING */
window.goToPricing=function(){
window.location.href="index.html#pricing";
};

/* DEFAULT LOAD */
loadDeals();

</script>

</body>
</html>
