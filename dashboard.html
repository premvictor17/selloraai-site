<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SELLORA Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/charts/loader.js"></script>

<style>
.hidden{display:none}
.card{
background:#1e293b;
padding:20px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}
</style>

</head>

<body class="bg-slate-900 text-white">

<div class="flex">

<!-- SIDEBAR -->
<div class="w-64 h-screen bg-black p-6">

<h1 class="text-xl font-bold mb-10">SELLORA</h1>

<nav class="space-y-4 text-gray-300">

<button onclick="showSection('deal')">AI Deal Engine</button>
<button onclick="showSection('overview')">Overview</button>
<button onclick="showSection('trending')">Trending</button>
<button onclick="showSection('scanner')">Scanner</button>
<button onclick="showSection('imports')">Imports</button>
<button onclick="showSection('alerts')">Alerts</button>
<button onclick="showSection('radar')">Radar</button>
<button onclick="showSection('predictor')">Predictor</button>
<button onclick="showSection('suppliers')">Suppliers</button>
<button onclick="showSection('heatmap')">Map</button>
<button onclick="showSection('ai')">AI</button>
<button onclick="showSection('saved')">Saved</button>

<button id="logoutBtn" onclick="logout()" class="block w-full text-left text-red-400 mt-10">
Logout
</button>

</nav>
</div>
<!-- MAIN -->
<div class="flex-1 p-10">

<div id="overview">
<h1 class="text-3xl mb-6">Overview</h1>
</div>

<div id="deal" style="display:none">
<div id="dealList"></div>
</div>

<div id="trending" style="display:none">
<div id="productsList"></div>
</div>

<div id="scanner" style="display:none">
<div id="scannerList"></div>
</div>

<div id="imports" style="display:none">
<div id="importsList"></div>
</div>

<div id="alerts" style="display:none">
<div id="alertsList"></div>
</div>

<div id="radar" style="display:none">
<div id="radarList"></div>
</div>

<div id="predictor" style="display:none">
<div id="predictorList"></div>
</div>

<div id="suppliers" style="display:none">
<div id="supplierList"></div>
</div>

<div id="heatmap" style="display:none">
<div id="regions_div" style="height:500px;"></div>
</div>

<div id="ai" style="display:none">
<input id="aiQuery" class="text-black p-2">
<button onclick="runAI()">Search</button>
<div id="aiResults"></div>
</div>

<div id="saved" style="display:none">
<div id="savedDealsList"></div>
</div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDJGPJmz2459zqdIRTQfrWNy83w2qYnK68",
authDomain: "sellora-ai.firebaseapp.com",
projectId: "sellora-ai"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* SECTION SWITCH */
window.showSection = function(section){

const sections = [
"deal","overview","trending","scanner",
"imports","alerts","radar","predictor",
"suppliers","heatmap","ai","saved"
];

sections.forEach(id=>{
const el = document.getElementById(id);
if(el) el.style.display="none";
});

const active = document.getElementById(section);
if(active) active.style.display="block";

// ✅ LOAD FUNCTIONS
if(section==="deal") loadDeals();
if(section==="trending") loadProducts();
if(section==="scanner") loadScanner();
if(section==="imports") loadImports();
if(section==="alerts") loadAlerts();
if(section==="radar") loadRadar();
if(section==="predictor") loadPredictor();
if(section==="suppliers") loadSuppliers();
if(section==="heatmap") drawMap();
if(section==="saved") loadSavedDeals();

}

/* DEALS */
async function loadDeals(){
const products = await getDocs(collection(db,"products"));
const container = document.getElementById("dealList");
container.innerHTML="";

products.forEach(doc=>{
const d = doc.data() || {};
container.innerHTML += `<div class="card">${d.product || "No Data"}</div>`;
});
}

/* PRODUCTS */
async function loadProducts(){
const products = await getDocs(collection(db,"products"));
const container = document.getElementById("productsList");
container.innerHTML="";

products.forEach(doc=>{
const d = doc.data() || {};
container.innerHTML += `<div class="card">${d.product || "No Data"}</div>`;
});
}

/* SCANNER */
async function loadScanner(){
const products = await getDocs(collection(db,"products"));
const container = document.getElementById("scannerList");
container.innerHTML="";

products.forEach(doc=>{
const d = doc.data() || {};
container.innerHTML += `<div class="card">${d.product}</div>`;
});
}

/* SUPPLIERS */
async function loadSuppliers(){
const suppliers = await getDocs(collection(db,"suppliers"));
const container = document.getElementById("supplierList");
container.innerHTML="";

suppliers.forEach(doc=>{
const s = doc.data() || {};
container.innerHTML += `<div class="card">${s.supplier_name || "No Supplier"}</div>`;
});
}
async function loadImports(){
document.getElementById("importsList").innerHTML =
"<div class='card'>Global demand rising for eco products</div>";
}

  async function loadAlerts(){
document.getElementById("alertsList").innerHTML =
"<div class='card'>AI Alert: UAE food demand increasing</div>";
}

  async function loadRadar(){
document.getElementById("radarList").innerHTML =
"<div class='card'>Top Market: Germany</div>";
}

  async function loadPredictor(){
document.getElementById("predictorList").innerHTML =
"<div class='card'>Predicted Growth: +22%</div>";
}

  async function loadSavedDeals(){
document.getElementById("savedDealsList").innerHTML =
"<div class='card'>Saved Deals will appear here</div>";
}
/* MAP */
google.charts.load('current',{packages:['geochart']});
function drawMap(){
var data = google.visualization.arrayToDataTable([
['Country','Demand'],
['India',90],
['US',80]
]);
var chart = new google.visualization.GeoChart(document.getElementById('regions_div'));
chart.draw(data);
}

/* AI */
window.runAI = async function(){
const q=document.getElementById("aiQuery").value;
document.getElementById("aiResults").innerText="Searching for "+q;
}

showSection("overview");

</script>

</body>
</html>
