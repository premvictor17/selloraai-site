<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SELLORA Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/charts/loader.js"></script>

<style>

.hidden{
display:none;
}

.card{
background:#1e293b;
padding:24px;
border-radius:12px;
}

</style>

</head>

<body class="bg-slate-900 text-white">

<div class="flex">

<!-- SIDEBAR -->

<div class="w-64 h-screen bg-black p-6">

<h1 class="text-xl font-bold mb-10">SELLORA</h1>

<nav class="space-y-4 text-gray-300">

<button onclick="showSection('overview')" class="block hover:text-white">Overview</button>

<button onclick="showSection('trending')" class="block hover:text-white">Trending Products</button>

<button onclick="showSection('scanner')" class="block hover:text-white">Product Opportunity Scanner</button>

<button onclick="showSection('imports')" class="block hover:text-white">Global Import Tracker</button>

<button onclick="showSection('alerts')" class="block hover:text-white">AI Opportunity Alerts</button>

<button onclick="showSection('radar')" class="block hover:text-white">Global Export Radar</button>

<button onclick="showSection('predictor')" class="block hover:text-white">AI Market Predictor</button>

<button onclick="showSection('suppliers')" class="block hover:text-white">Supplier Intelligence</button>

<button onclick="showSection('heatmap')" class="block hover:text-white">Global Demand Map</button>

<button onclick="showSection('ai')" class="block hover:text-white">AI Export Advisor</button>

<button onclick="logout()" class="text-red-400 mt-10">Logout</button>

</nav>

</div>

<!-- MAIN -->

<div class="flex-1 p-10">

<div id="overview">

<h1 class="text-4xl font-bold mb-8">Dashboard Overview</h1>

<div class="grid grid-cols-4 gap-6">

<div class="card">
<p class="text-gray-400">Active Products</p>
<h2 class="text-3xl font-bold">128</h2>
</div>

<div class="card">
<p class="text-gray-400">Suppliers</p>
<h2 class="text-3xl font-bold">542</h2>
</div>

<div class="card">
<p class="text-gray-400">Markets</p>
<h2 class="text-3xl font-bold">38</h2>
</div>

<div class="card">
<p class="text-gray-400">Export Score</p>
<h2 class="text-3xl font-bold">89%</h2>
</div>

</div>

</div>

<div id="trending" class="hidden">
<h2 class="text-3xl font-bold mb-6">Trending Products</h2>
</div>

<div id="scanner" class="hidden">
<h2 class="text-3xl font-bold mb-6">Product Opportunity Scanner</h2>
</div>

<div id="imports" class="hidden">
<h2 class="text-3xl font-bold mb-6">Global Import Tracker</h2>
</div>

<div id="alerts" class="hidden">
<h2 class="text-3xl font-bold mb-6">AI Opportunity Alerts</h2>
</div>

<div id="radar" class="hidden">
<h2 class="text-3xl font-bold mb-6">Global Export Radar</h2>
</div>

<div id="predictor" class="hidden">
<h2 class="text-3xl font-bold mb-6">AI Market Predictor</h2>
</div>

<div id="suppliers" class="hidden">
<h2 class="text-3xl font-bold mb-6">Supplier Intelligence</h2>
</div>

<div id="heatmap" class="hidden">

<h2 class="text-3xl font-bold mb-6">Global Demand Map</h2>

<div id="regions_div" style="width:100%; height:70vh;"></div>

</div>

<div id="ai" class="hidden">
<h2 class="text-3xl font-bold mb-6">AI Export Advisor</h2>
</div>

</div>

</div>

<script>

function showSection(section){

const sections=[
"overview",
"trending",
"scanner",
"imports",
"alerts",
"radar",
"predictor",
"suppliers",
"heatmap",
"ai"
];

sections.forEach(id=>{
const el=document.getElementById(id);
if(el) el.classList.add("hidden");
});

const active=document.getElementById(section);
if(active) active.classList.remove("hidden");

if(section==="heatmap"){
google.charts.setOnLoadCallback(drawMap);
}

}

google.charts.load('current',{packages:['geochart']});

function drawMap(){

var data=google.visualization.arrayToDataTable([
['Country','Demand'],
['United Arab Emirates',92],
['United States',88],
['Germany',85],
['United Kingdom',83],
['Canada',78],
['India',90]
]);

var options={
colorAxis:{colors:['#93c5fd','#4f46e5']},
backgroundColor:'#0f172a',
datalessRegionColor:'#1e293b'
};

var chart=new google.visualization.GeoChart(
document.getElementById('regions_div')
);

chart.draw(data,options);

}

function logout(){
localStorage.clear();
window.location.href="login.html";
}

</script>

</body>
</html>
